<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orgaversum - Todo Planeten Abenteuer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <h1>Orgaversum</h1>
            <div class="toolbar-buttons">
                <button id="addPlanet" class="btn btn-planet">
                    <span class="icon">+</span> Planet
                </button>
                <button id="addMoon" class="btn btn-moon">
                    <span class="icon">+</span> Mond
                </button>
                <button id="toggleConnect" class="btn btn-connect">
                    <span class="icon">🔗</span> Verbinden
                </button>
                <button id="clearAll" class="btn btn-clear">
                    <span class="icon">🗑</span> Leeren
                </button>
            </div>
            <div id="connectMode" class="connect-indicator hidden">
                Verbindungsmodus aktiv - Klicke zwei Objekte
            </div>
        </div>
        <canvas id="universe"></canvas>

        <!-- Modal für Namen -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modalTitle">Neuer Planet</h2>
                <input type="text" id="nameInput" placeholder="Name eingeben..." autofocus>
                <div class="modal-buttons">
                    <button id="modalCancel" class="btn btn-cancel">Abbrechen</button>
                    <button id="modalConfirm" class="btn btn-confirm">Erstellen</button>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal hidden">
            <div class="modal-content">
                <h2>Bearbeiten</h2>
                <input type="text" id="editNameInput" placeholder="Name bearbeiten...">
                <div class="modal-buttons">
                    <button id="editDelete" class="btn btn-delete">Löschen</button>
                    <button id="editCancel" class="btn btn-cancel">Abbrechen</button>
                    <button id="editConfirm" class="btn btn-confirm">Speichern</button>
                </div>
                <div id="stationControls" class="station-controls hidden">
                    <h3>Raumstationen</h3>
                    <div class="station-buttons">
                        <button id="addImage" class="btn btn-station" data-type="image">Bild</button>
                        <button id="addVideo" class="btn btn-station" data-type="video">Video</button>
                        <button id="addAudio" class="btn btn-station" data-type="audio">Audio</button>
                        <button id="addNote" class="btn btn-station" data-type="note">Notiz</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Station Upload Modal -->
        <div id="stationModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="stationModalTitle">Raumstation hinzufügen</h2>
                <input type="text" id="stationName" placeholder="Name der Station...">
                <div id="fileUploadArea" class="file-upload-area">
                    <input type="file" id="fileInput" accept="*/*">
                    <p>Datei hierher ziehen oder klicken</p>
                </div>
                <textarea id="noteInput" class="note-input hidden" placeholder="Notiz eingeben..."></textarea>
                <div class="modal-buttons">
                    <button id="stationCancel" class="btn btn-cancel">Abbrechen</button>
                    <button id="stationConfirm" class="btn btn-confirm">Hinzufügen</button>
                </div>
            </div>
        </div>

        <!-- Station Preview Modal -->
        <div id="previewModal" class="modal hidden">
            <div class="modal-content preview-content">
                <h2 id="previewTitle">Station</h2>
                <div id="previewContainer"></div>
                <div class="modal-buttons">
                    <button id="previewDelete" class="btn btn-delete">Löschen</button>
                    <button id="previewClose" class="btn btn-cancel">Schließen</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
